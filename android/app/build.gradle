plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.kapt'
}

def signingValues = ['STRIDEHUB_KEYSTORE', 'STRIDEHUB_STORE_PASSWORD', 'STRIDEHUB_KEY_ALIAS', 'STRIDEHUB_KEY_PASSWORD']
def hasReleaseKey = signingValues.every { System.getenv(it) }

android {
    namespace 'io.stridehub.app'
    useLibrary 'android.test.runner', false
    useLibrary 'android.test.base', false
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'io.stridehub.app'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(System.getenv('STRIDEHUB_KEYSTORE'))
                storePassword System.getenv('STRIDEHUB_STORE_PASSWORD')
                keyAlias System.getenv('STRIDEHUB_KEY_ALIAS')
                keyPassword System.getenv('STRIDEHUB_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            if (hasReleaseKey) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { compose true }
    kotlinOptions { jvmTarget = '17' }
    testOptions {
        unitTests.all { workingDir = rootProject.projectDir }
    }
    lint {
        abortOnError true
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

// Fail the build if a future business flow accidentally restores browser authentication/UI.
tasks.register('verifyNativeUi') {
    group = 'verification'
    description = 'Reject browser-rendered UI and cookie/JavaScript authentication in production code.'
    doLast {
        def forbidden = ~/(android\.webkit\.(WebView|CookieManager)|\bnew\s+WebView\s*\(|\bWebView\s*\(|evaluateJavascript\s*\()/
        fileTree('src/main') { include '**/*.java', '**/*.kt' }.each { source ->
            if ((source.text =~ forbidden).find()) throw new GradleException("Native-only UI violation: ${source}")
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyNativeUi' }
tasks.named('check').configure { dependsOn 'verifyNativeUi' }

// Lint's Kotlin source index reads kapt stubs; regenerate them before indexing tests.
tasks.matching { it.name == 'lintAnalyzeDebugAndroidTest' }.configureEach {
    dependsOn 'kaptDebugAndroidTestKotlin'
}
tasks.matching { it.name == 'lintAnalyzeDebugUnitTest' }.configureEach {
    dependsOn 'kaptDebugUnitTestKotlin'
}
