# Include inside the public HTTPS server alongside the existing StrideHub routes.
# Without these locations, a shared Panel entry may return HTML for native login.
location = /mobile/v1/sessions {
    limit_req zone=stridehub_login burst=10 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/stridehub-proxy.inc;
}
location ^~ /mobile/v1/ {
    include /etc/nginx/snippets/stridehub-proxy.inc;
}
